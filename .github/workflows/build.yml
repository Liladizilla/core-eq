name: CORE-EQ CI
on:
  push:
    branches: [main, 'core-eq/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ DSP
        run: cmake -S native/dsp -B build-dsp -DCMAKE_BUILD_TYPE=Release
      - name: Compile DSP and tests
        run: cmake --build build-dsp --parallel
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner scaffold
        run: flutter create --platforms=android --project-name core_eq .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-pub
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'
      - name: Build and package Android native library
        run: bash scripts/build_android_native.sh
      - name: Verify native libraries are packaged
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libcore_eq.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libcore_eq.so
          test -f android/app/src/main/jniLibs/x86_64/libcore_eq.so
