name: CORE-EQ CI
on:
  push:
    branches: [main, 'core-eq/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ DSP
        run: cmake -S native/dsp -B build-dsp -DCMAKE_BUILD_TYPE=Release
      - name: Compile DSP and tests
        run: cmake --build build-dsp --parallel
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner scaffold
        run: flutter create --platforms=android --project-name core_eq .
      - name: Set Android compile SDK for current plugins
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' android/app/build.gradle
          else
            echo 'Android app Gradle file not found' >&2
            exit 1
          fi
      - name: Apply CORE-EQ Android launcher branding
        run: bash scripts/apply_android_branding.sh
      - name: Verify Android launcher branding resources
        run: |
          test -s android/app/src/main/res/drawable/ic_core_eq.xml
          test -s android/app/src/main/res/drawable/ic_core_eq_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/values/core_eq_colors.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Raise file_picker plugin compile SDK
        run: |
          FILE_PICKER_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/file_picker-*/android/build.gradle' -not -path '*/example/*' -print -quit)"
          if [ -z "$FILE_PICKER_GRADLE" ]; then
            echo 'file_picker package Android Gradle file not found in pub cache' >&2
            find "$HOME/.pub-cache/hosted/pub.dev" -path '*/file_picker-*/*gradle*' -print | head -40
            exit 1
          fi
          echo "Patching package Gradle file: $FILE_PICKER_GRADLE"
          sed -i -E 's/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g; s/compileSdk[[:space:]]+34/compileSdk 36/g' "$FILE_PICKER_GRADLE"
          grep -nE 'compileSdk(Version)?' "$FILE_PICKER_GRADLE"
          if grep -Eq 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*34' "$FILE_PICKER_GRADLE"; then
            echo 'file_picker still declares compile SDK 34 after patch' >&2
            exit 1
          fi
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-pub
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'
      - name: Build and package Android native library
        run: bash scripts/build_android_native.sh
      - name: Verify native libraries are packaged
        run: |
          test -f android/app/src/main/jniLibs/arm64-v8a/libcore_eq.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libcore_eq.so
          test -f android/app/src/main/jniLibs/x86_64/libcore_eq.so
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: core-eq-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
