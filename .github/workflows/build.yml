name: CORE-EQ CI
on:
  push:
    branches: [main, 'core-eq/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ DSP
        run: cmake -S native/dsp -B build-dsp -DCMAKE_BUILD_TYPE=Release
      - name: Compile DSP and tests
        run: cmake --build build-dsp --parallel
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner scaffold
        run: flutter create --platforms=android --project-name core_eq .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: core-eq-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
