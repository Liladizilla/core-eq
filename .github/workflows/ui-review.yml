name: CORE-EQ Desktop UI Review
on:
  push:
    branches: [core-eq/ui-review-desktop-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop and screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb imagemagick
      - name: Generate Linux desktop runner
        run: flutter create --platforms=linux --project-name core_eq .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run widget tests
        run: flutter test
      - name: Analyze Dart code
        run: flutter analyze --no-pub
      - name: Build Linux desktop preview
        run: flutter build linux --release
      - name: Capture actual app window
        run: |
          mkdir -p artifacts
          xvfb-run -a -s "-screen 0 1440x1000x24" bash -lc '
            build/linux/x64/release/bundle/core_eq &
            APP_PID=$!
            trap "kill $APP_PID 2>/dev/null || true" EXIT
            sleep 8
            import -window root artifacts/core-eq-desktop-preview.png
          '
      - name: Upload desktop preview and runnable bundle
        uses: actions/upload-artifact@v4
        with:
          name: core-eq-desktop-ui-review
          path: |
            artifacts/core-eq-desktop-preview.png
            build/linux/x64/release/bundle/
